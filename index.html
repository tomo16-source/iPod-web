<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="iPod-web">
<meta name="theme-color" content="#222222">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>iPod-web</title>

<style>
body{
  background:#222;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  width:100vw;
  overflow:hidden;
  font-family:sans-serif;
  user-select:none;
  -webkit-user-select:none;
  margin:0;
  padding:0;
}

#ipod{width:260px;height:420px;background:#f5f5f5;border-radius:20px;padding:10px;display:flex;flex-direction:column;transform-origin:center center;}
#screen{background:#e5e5e5;height:160px;border-radius:10px;position:relative;margin:5px;overflow:hidden;}
#boot{position:absolute;width:100%;height:100%;background:#333;display:flex;justify-content:center;align-items:center;color:white;font-size:48px;z-index:100;}

/* トップバー：常に全幅 */
#topbar{position:absolute;top:0;left:0;width:50%;height:20px;background:#ccc;box-sizing:border-box;}
#topbar::after{content:"";position:absolute;left:100%;top:0;width:100vw;height:100%;background:#555;}
#topbar.full{width:100%;}
#toptext{position:absolute;left:6px;top:3px;font-size:10px;font-weight:bold;}
#status{position:absolute;right:40px;top:3px;font-size:10px;}
#battery{position:absolute;right:6px;top:3px;width:20px;height:10px;border:2px solid #444;display:flex;padding:1px;}
#battery::before{content:"";position:absolute;right:-4px;top:2px;width:3px;height:6px;background:#444;}
.battery-cell{flex:1;background:#2a2;}
.battery-cell:first-child{border-left:none;}

/* コンテンツエリア */
#content{position:absolute;top:20px;left:0;right:0;bottom:0;display:flex;overflow:hidden;background:#555;}

@keyframes slideInRight {from{transform:translateX(100%);}to{transform:translateX(0);}}
@keyframes slideInLeft  {from{transform:translateX(-100%);}to{transform:translateX(0);}}
@keyframes slideOutRight{from{transform:translateX(0);}to{transform:translateX(100%);}}

#list.slide-out-right{animation:slideOutRight 0.18s ease-out;}

/* リストのクリップ用ラッパー */
#list-wrapper{position:relative;width:50%;overflow:hidden;flex-shrink:0;}
#list-wrapper.full{width:100%;}

#list{position:relative;width:100%;height:100%;overflow:hidden;background:#e5e5e5;}
#list.slide-right{animation:slideInRight 0.18s ease-out;}
#list.slide-left {animation:slideInLeft  0.18s ease-out;}

.item{height:28px;line-height:28px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;display:flex;align-items:center;justify-content:space-between;}
.item.active{background:#3399cc;color:white;border-radius:6px;}
.item .arrow{font-size:9px;opacity:0.5;}
.item.active .arrow{opacity:1;}

.marquee-wrap{overflow:hidden;flex:1;}
.marquee-inner{display:inline-block;white-space:nowrap;}

/* プレビューエリア（右半分） */
#preview{width:50%;height:100%;overflow:hidden;position:relative;background:#555;}
#preview img{
  position:absolute;
  width:140%;height:140%;
  object-fit:cover;
  animation:float 20s linear infinite;
}
#preview.hidden{display:none;}

@keyframes float{
  0%{transform:translate(0,0);}
  25%{transform:translate(-20%,0);}
  50%{transform:translate(-20%,-20%);}
  75%{transform:translate(0,-20%);}
  100%{transform:translate(0,0);}
}

/* Now Playing画面 */
/* nowplayingはlist-wrapperに重なる位置 */
#nowplaying{position:absolute;top:20px;left:0;width:50%;bottom:0;display:none;flex-direction:column;overflow:hidden;z-index:5;background:#e5e5e5;}
#nowplaying.fullwidth{width:100%;}

#nowplaying.visible{display:flex;}

/* 上段：左サムネ＋右情報の2カラム */
#np-top{display:flex;flex-direction:row;flex:1;overflow:hidden;}

/* 左：サムネイルを中央に */
#np-thumb-col{width:50%;display:flex;align-items:center;justify-content:center;padding:6px;}
#np-thumb{width:80px;height:80px;object-fit:cover;border-radius:6px;flex-shrink:0;box-shadow:4px 4px 12px rgba(0,0,0,0.4);transform:perspective(200px) rotateY(20deg);}

/* 右：情報を中央に */
#np-info{width:50%;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:6px 6px 6px 2px;overflow:hidden;}
#np-title-wrap{overflow:hidden;width:100%;}
#np-title-inner{display:inline-block;white-space:nowrap;font-size:11px;font-weight:bold;}
#np-artist{font-size:10px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#np-track{font-size:10px;color:#888;}

/* 下段：バーエリア */
#np-bar-area{padding:0 6px 6px 6px;display:flex;flex-direction:column;gap:2px;}
#np-seekbar{width:100%;height:4px;background:#bbb;border-radius:2px;overflow:hidden;}
#np-seekfill{height:100%;background:#09c;width:0%;border-radius:2px;transition:width 0.4s linear;}
#np-times{display:flex;justify-content:space-between;font-size:9px;color:#777;}
#np-volbar{width:100%;height:4px;background:#bbb;border-radius:2px;overflow:hidden;}
#np-volfill{height:100%;background:#09c;width:80%;border-radius:2px;transition:width 0.15s ease;}


/* 仕切り線 */
#divider{display:none!important;}
#divider.hidden{display:none;}

/* ホイール */
#bottom-area{flex:1;display:flex;justify-content:center;align-items:center;}
#wheel{width:200px;height:200px;background:#ddd;border-radius:50%;position:relative;touch-action:none;}
.btn{pointer-events:auto;cursor:pointer;}
.top{position:absolute;top:10px;width:100%;text-align:center;font-size:11px;padding-bottom:12px;}
.bottom{position:absolute;bottom:10px;width:100%;text-align:center;padding-top:12px;}
.left{position:absolute;left:10px;top:90px;padding-right:12px;}
.right{position:absolute;right:10px;top:90px;padding-left:12px;}
.center{position:absolute;width:80px;height:80px;background:white;border-radius:50%;top:60px;left:60px;cursor:pointer;}
</style>
</head>

<body>
<div id="ipod">
  <div id="screen">
    <div id="boot">&#xf8ff;</div>

    <div id="topbar">
      <div id="toptext">iPod</div>
      <div id="status"></div>
      <div id="battery">
        <div class="battery-cell"></div>
        <div class="battery-cell"></div>
        <div class="battery-cell"></div>
        <div class="battery-cell"></div>
      </div>
    </div>

    <div id="divider"></div>

    <div id="content">
      <div id="list-wrapper"><div id="list"></div></div>
      <div id="preview"></div>
    </div>

    <!-- プレイリスト入力オーバーレイ -->
    <!-- プレイリスト入力（全画面） -->
    <div id="playlist-overlay" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:#e5e5e5;z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;">
      <div style="font-size:11px;font-weight:bold;color:#333;">プレイリスト追加</div>
      <div id="playlist-status" style="font-size:10px;color:#555;text-align:center;"></div>
      <input id="playlist-input" type="text" placeholder="YouTube URL" style="width:90%;font-size:10px;padding:4px 6px;border:1px solid #aaa;border-radius:4px;outline:none;background:white;color:#333;-webkit-user-select:text;user-select:text;pointer-events:all;"/>
      <div id="playlist-result" style="font-size:9px;color:#888;text-align:center;"></div>
    </div>

    <!-- Now Playing画面 -->
    <div id="nowplaying">
      <div id="np-top">
        <div id="np-thumb-col">
          <img id="np-thumb" src="" alt="">
        </div>
        <div id="np-info">
          <div id="np-title-wrap"><span id="np-title-inner">---</span></div>
          <div id="np-artist">---</div>
          <div id="np-track">- / -</div>
        </div>
      </div>
      <div id="np-bar-area">
        <div id="np-seekbar"><div id="np-seekfill"></div></div>
        <div id="np-volrow" style="display:none;align-items:center;gap:4px;">
          <span id="np-voldown" style="font-size:10px;">🔉</span>
          <div id="np-volbar" style="flex:1;"><div id="np-volfill"></div></div>
          <span id="np-volup" style="font-size:10px;">🔊</span>
        </div>
        <div id="np-times"><span id="np-cur">0:00</span><span id="np-dur">0:00</span></div>
      </div>
    </div>
  </div>

  <div id="bottom-area">
    <div id="wheel">
      <div id="btn-menu" class="top btn">MENU</div>
      <div id="btn-play" class="bottom btn">⏯&#xFE0E;</div>
      <div id="btn-prev" class="left btn">⏮&#xFE0E;</div>
      <div id="btn-next" class="right btn">⏭&#xFE0E;</div>
      <div class="center"></div>
    </div>
  </div>
</div>

<div id="player" style="position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:-1;"></div>
<audio id="localplayer" style="display:none" playsinline></audio>
<input type="file" id="local-file-input" accept="audio/*" multiple style="display:none">
<script src="https://www.youtube.com/iframe_api"></script>

      {get label(){return t(clickSoundEnabled?"clickon":"clickoff");}, arrow:false, action:"toggleclick"},
    ],
    language:[
      {label:lang==="en"?"日本語":"English", arrow:false, action:"setlang"},
    ],
    playlist:[
      {get label(){return t("playlistpaste");}, arrow:false, action:"openplaylist"},
    ],
  };
}
let MENUS=buildMenus();
function rebuildMenus(){MENUS=buildMenus();}

/* =====================

===================== */
let player, isPlaying=false, hasPlayed=false;
let currentSongIdx=0;
let timeInterval=null;

// 現在の画面モード: "menu" | "nowplaying"
let screenMode="menu";

const visibleCount=5;

/* =====================
   YouTube
===================== */
function onYouTubeIframeAPIReady(){
  player=new YT.Player('player',{
    height:'1',width:'1',
    playerVars:{playsinline:1},
    events:{onStateChange:onPlayerStateChange}
  });
}

function onPlayerStateChange(e){
  if(e.data===YT.PlayerState.ENDED) nextTrackAuto();  // 自動遷移（クリック音なし）
  if(e.data===YT.PlayerState.PLAYING){isPlaying=true;updateStatus();}
  if(e.data===YT.PlayerState.PAUSED){isPlaying=false;updateStatus();}
}

function _b64ToArrayBuffer(b64){
  const bin=atob(b64);
  const buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  return buf.buffer;
}

async function _initAudio(){
  try{
    if(!_actx){
      _actx=new (window.AudioContext||window.webkitAudioContext)();
    }
    if(_actx.state==="suspended"){
      await _actx.resume();
    }
    if(!_clickBuffer){
      _clickBuffer=await _actx.decodeAudioData(_b64ToArrayBuffer(_clickB64));
      _audioReady=true;
    }
  }catch(e){console.log("audio init:",e);}
}

// タッチ/クリックのたびにAudio初期化とresumeを試みる
document.addEventListener("touchstart",()=>{
  _initAudio();
  if(_actx&&_actx.state==="suspended") _actx.resume();
},{passive:true});
document.addEventListener("mousedown",()=>{
  _initAudio();
  if(_actx&&_actx.state==="suspended") _actx.resume();
});

function clickSound(){
  if(!clickSoundEnabled)return;
  if(!_audioReady||!_actx||!_clickBuffer)return;
  try{
    const src=_actx.createBufferSource();
    src.buffer=_clickBuffer;
    src.connect(_actx.destination);
    src.start(0);
  }catch(e){}
}

function updateStatus(){
  document.getElementById("status").textContent=hasPlayed?(isPlaying?"▶︎":"⏸︎"):"";
}

function fmtTime(sec){
  if(isNaN(sec)||sec<0)return"0:00";
  const m=Math.floor(sec/60), s=Math.floor(sec%60);
  return m+":"+(s<10?"0":"")+s;
}

function updateNowPlayingTime(){
  const s=songs[currentSongIdx];
  let cur=0,dur=0;
  if(s&&s.source==="local"){
    cur=localplayer.currentTime||0;
    dur=localplayer.duration||0;
  } else {
    if(!player||!player.getCurrentTime)return;
    cur=player.getCurrentTime()||0;
    dur=player.getDuration()||0;
  }
  document.getElementById("np-cur").textContent=fmtTime(cur);
  document.getElementById("np-dur").textContent=fmtTime(dur);
  const pct=dur>0?(cur/dur*100):0;
  document.getElementById("np-seekfill").style.width=pct+"%";
}

let npTitleScrolling=false;
function startNpTitleScroll(){
  const inner=document.getElementById("np-title-inner");
  const wrap=document.getElementById("np-title-wrap");
  if(!inner||!wrap)return;

  // リセット
  npTitleScrolling=false;
  inner.style.transform="translateX(0)";

  // 収まるなら固定
  const textWidth=inner.scrollWidth;
  const wrapWidth=wrap.offsetWidth;
  if(textWidth<=wrapWidth) return;

  // 収まらない場合：3秒後に1回だけリストと同じ動作で流れて止まる
  npTitleScrolling=true;
  const gapPx=28;
  const stopAt=textWidth+gapPx;

  // [text1][gap][text2]構造
  const text=inner.textContent;
  inner.innerHTML=
    `<span class="sc-t1">${text}</span>`+
    `<span style="display:inline-block;width:${gapPx}px"></span>`+
    `<span class="sc-t2">${text}</span>`;

  setTimeout(()=>{
    if(!npTitleScrolling)return; // 曲が変わっていたらキャンセル
    let pos=0;
    let stopped=false;
    function step(){
      if(!npTitleScrolling||stopped)return;
      pos-=0.5;
      // sc-t2の左端がwrapの左端に来たら止まる
      const t2=inner.querySelector('.sc-t2');
      const wrapLeft=wrap.getBoundingClientRect().left;
      const t2Left=t2?t2.getBoundingClientRect().left:Infinity;
      if(t2Left<=wrapLeft+1){
        stopped=true;
        npTitleScrolling=false;
        return;
      }
      inner.style.transform=`translateX(${pos}px)`;
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  },3000);
}

function getClockText(){
  const now=new Date();
  let h=now.getHours(), m=now.getMinutes();
  if(!clock24h){
    const ampm=h>=12?"PM":"AM";
    h=h%12||12;
    return h+":"+(m<10?"0":"")+m+" "+ampm;
  }
  return (h<10?"0":"")+h+":"+(m<10?"0":"")+m;
}

/* =====================
   再生制御
===================== */
async function playSong(idx){
  currentSongIdx=idx;
  const s=songs[idx];
  await _initAudio(); // スマホ対応：AudioContext初期化を完了してから再生
  if(s.source==="local"){
    if(player&&player.pauseVideo){try{player.pauseVideo();}catch(e){}}
    localplayer.src=s.url;
    try{ await localplayer.play(); }catch(e){console.log("local play:",e);}
  } else {
    localplayer.pause();
    player.loadVideoById(s.id);
  }
  isPlaying=true;hasPlayed=true;
  updateStatus();
  updateNowPlayingInfo();
  startTimeInterval();
}

function togglePlay(){
  if(!hasPlayed)return;
  const s=songs[currentSongIdx];
  if(s&&s.source==="local"){
    isPlaying?localplayer.pause():localplayer.play();
  } else {
    isPlaying?player.pauseVideo():player.playVideo();
  }
  clickSound();
}

function syncSongsMenuCursor(){
  // songsメニューが開いていれば選択カーソルも連動させる
  for(let i=menuStack.length-1;i>=0;i--){
    if(menuStack[i].menuKey==="songs"){
      menuStack[i].selectedIdx=currentSongIdx;
      // スクロールオフセットも調整
      if(currentSongIdx<menuStack[i].scrollOffset)
        menuStack[i].scrollOffset=currentSongIdx;
      if(currentSongIdx>=menuStack[i].scrollOffset+visibleCount)
        menuStack[i].scrollOffset=currentSongIdx-visibleCount+1;
      break;
    }
  }
  render();
}

function nextTrackAuto(){
  // 曲終了時の自動スキップ（クリック音なし）
  if(shuffleMode){
    const idx=randomOtherIdx();
    if(!shuffleMode) return;
    playSong(idx);syncSongsMenuCursor();
  } else if(currentSongIdx<songs.length-1){
    currentSongIdx++;playSong(currentSongIdx);syncSongsMenuCursor();
  }
}

function nextTrack(){
  if(shuffleMode){
    // 履歴に次がある場合はそれを使う（戻った後に進む場合）
    if(shufflePos<shuffleHistory.length-1){
      shufflePos++;
      const idx=shuffleHistory[shufflePos];
      playSong(idx);syncSongsMenuCursor();clickSound();
    } else {
      const idx=randomOtherIdx();
      if(!shuffleMode) return; // 全曲再生済みで終了
      playSong(idx);syncSongsMenuCursor();clickSound();
    }
  } else if(currentSongIdx<songs.length-1){
    currentSongIdx++;playSong(currentSongIdx);syncSongsMenuCursor();clickSound();
  }
}

function prevTrack(){
  if(shuffleMode){
    if(shufflePos>0){
      shufflePos--;
      const idx=shuffleHistory[shufflePos];
      playSong(idx);syncSongsMenuCursor();clickSound();
    }
  } else if(currentSongIdx>0){
    currentSongIdx--;playSong(currentSongIdx);syncSongsMenuCursor();clickSound();
  }
}

let shuffleHistory=[];  // 再生済みインデックス（順番に記録）
let shufflePos=-1;      // 履歴の現在位置

function shufflePlay(){
  shuffleMode=true;
  shuffleHistory=[];
  shufflePos=-1;
  const idx=Math.floor(Math.random()*songs.length);
  shuffleHistory.push(idx);
  shufflePos=0;
  playSong(idx);
  clickSound();
}

function randomOtherIdx(){
  if(songs.length<=1)return currentSongIdx;
  // 未再生の曲から選ぶ
  let remaining=songs.map((_,i)=>i).filter(i=>!shuffleHistory.includes(i));
  // 全曲再生済みなら終了
  if(remaining.length===0){
    shuffleMode=false;
    shuffleHistory=[];
    return currentSongIdx; // 次の曲なし＝再生終了
  }
  const idx=remaining[Math.floor(Math.random()*remaining.length)];
  shuffleHistory.push(idx);
  shufflePos=shuffleHistory.length-1;
  return idx;
}

const LOCAL_ART_SVG="data:image/svg+xml;utf8,"+encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="%23333"/><text x="50%" y="54%" font-size="90" text-anchor="middle" fill="%23bbb" font-family="sans-serif">&#9834;</text></svg>'
);

function thumbUrl(s){
  return s.source==="local" ? LOCAL_ART_SVG : `https://img.youtube.com/vi/${s.id}/0.jpg`;
}

function updateNowPlayingInfo(){
  const s=songs[currentSongIdx];
  document.getElementById("np-thumb").src=thumbUrl(s);
  document.getElementById("np-artist").textContent=s.artist;
  const inner=document.getElementById("np-title-inner");
  npTitleScrolling=false;
  inner.textContent=s.title;
  inner.style.transform="translateX(0)";
  document.getElementById("np-track").textContent=(currentSongIdx+1)+" / "+songs.length;
  setTimeout(startNpTitleScroll, 100);

  // MediaSession API（ロック画面・通知センターに曲情報を表示）
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({
      title:s.title,
      artist:s.artist,
      album:"iPod-web",
      artwork: s.source==="local"
        ? [{src:LOCAL_ART_SVG,sizes:"200x200",type:"image/svg+xml"}]
        : [
            {src:`https://img.youtube.com/vi/${s.id}/mqdefault.jpg`,sizes:"320x180",type:"image/jpeg"},
            {src:`https://img.youtube.com/vi/${s.id}/hqdefault.jpg`,sizes:"480x360",type:"image/jpeg"},
          ]
    });
    navigator.mediaSession.setActionHandler("play",()=>togglePlayIfPaused());
    navigator.mediaSession.setActionHandler("pause",()=>togglePlayIfPlaying());
    navigator.mediaSession.setActionHandler("nexttrack",()=>nextTrack());
    navigator.mediaSession.setActionHandler("previoustrack",()=>prevTrack());
  }
}

function togglePlayIfPaused(){ if(!isPlaying) togglePlay(); }
function togglePlayIfPlaying(){ if(isPlaying) togglePlay(); }

/* =====================
   画面描画
===================== */
function startScroll(el,text){
  const gap="     ";
  // テキスト幅を計測
  const span=document.createElement("span");
  span.style.cssText="white-space:nowrap;visibility:hidden;position:absolute;";
  span.textContent=text;
  document.body.appendChild(span);
  const textWidth=span.offsetWidth;
  const wrapWidth=el.parentElement?el.parentElement.offsetWidth:0;
  document.body.removeChild(span);

  // 見切れていない場合はそのまま表示して終了
  if(textWidth<=wrapWidth){
    el.style.transform="translateX(0)";
    el.textContent=text;
    return;
  }

  // 見切れている場合：
  // wrapの左端座標を基準にtext2が来たら止まる
  const wrap = el.closest('.marquee-wrap');
  const gapPx = 28;

  el.innerHTML =
    `<span class="sc-t1">${text}</span>`+
    `<span style="display:inline-block;width:${gapPx}px"></span>`+
    `<span class="sc-t2">${text}</span>`;

  let stopped = false;
  function step(){
    if(stopped) return;

    // wrapの左端X座標（画面上の実際の位置）
    const wrapLeft = wrap ? wrap.getBoundingClientRect().left : 0;
    // text2の左端X座標
    const t2 = el.querySelector('.sc-t2');
    const t2Left = t2 ? t2.getBoundingClientRect().left : Infinity;

    // text2の左端がwrapの左端に達したら止まる
    if(t2Left <= wrapLeft + 1){
      // 現在のposを固定
      stopped = true;
      return;
    }

    const cur = el.style.transform;
    const match = cur.match(/translateX\(([-\d.]+)px\)/);
    const pos = match ? parseFloat(match[1]) : 0;
    el.style.transform = `translateX(${pos - 0.5}px)`;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function render(){
  if(screenMode!=="menu")return;

  const cur=menuStack[menuStack.length-1];
  const menuKey=cur.menuKey;
  const items=MENUS[menuKey];
  const selIdx=cur.selectedIdx;
  const scrollOffset=cur.scrollOffset;

  // トップバーのタイトル
  const titleKeys={main:"main",music:"music",songs:"songs",extras:"extras",settings:"settings",language:"language",playlist:"playlist"};
  document.getElementById("toptext").textContent=t(titleKeys[menuKey]||"main");

  const listEl=document.getElementById("list");
  const listWrapper=document.getElementById("list-wrapper");
  const previewEl=document.getElementById("preview");
  const dividerEl=document.getElementById("divider");
  listEl.innerHTML="";

  // リスト表示モードに応じてレイアウト切り替え
  const topbarEl=document.getElementById("topbar");
  if(menuKey==="songs" && listThumbMode){
    // サムネイルモード：左半分リスト＋右サムネ
    listEl.classList.remove("full");
    listWrapper.classList.remove("full");
    listWrapper.style.overflow="hidden";
    dividerEl.classList.remove("hidden");
    previewEl.classList.remove("hidden");
    previewEl.innerHTML=`<img src="${thumbUrl(songs[selIdx])}">`;
    topbarEl.classList.remove("full");
  } else if(menuKey==="songs" && !listThumbMode){
    // 全画面モード：リスト全幅、仕切り・サムネなし、バーも全幅
    listEl.classList.add("full");
    listWrapper.classList.add("full");
    listWrapper.style.overflow="visible";
    dividerEl.classList.add("hidden");
    previewEl.classList.add("hidden");
    topbarEl.classList.add("full");
  } else {
    // songs以外：左半分リスト＋仕切り線（右は空）
    listEl.classList.remove("full");
    listWrapper.classList.remove("full");
    listWrapper.style.overflow="hidden";
    dividerEl.classList.remove("hidden");
    previewEl.classList.add("hidden");
    topbarEl.classList.remove("full");
  }

  // 曲が空の場合はメッセージ表示
  if(menuKey==="songs" && songs.length===0){
    const lines=t("nosongs").split("\n");
    lines.forEach(line=>{
      const div=document.createElement("div");
      div.style.cssText="font-size:10px;color:#666;padding:4px 6px;line-height:1.6;";
      div.textContent=line;
      listEl.appendChild(div);
    });
    return;
  }

  for(let i=0;i<visibleCount;i++){
    const idx=scrollOffset+i;
    if(idx>=items.length) break;
    const item=items[idx];
    const itemLabel=item.label!==undefined ? item.label : t(item.labelKey);

    const div=document.createElement("div");
    div.className="item";
    if(idx===selIdx) div.classList.add("active");

    if(idx===selIdx){
      // 選択中：marqueeスクロール
      const wrap=document.createElement("div");
      wrap.className="marquee-wrap";
      const inner=document.createElement("div");
      inner.className="marquee-inner";
      wrap.appendChild(inner);
      div.appendChild(wrap);
      if(item.arrow && idx===selIdx){const a=document.createElement("span");a.className="arrow";a.textContent=">";div.appendChild(a);}
      setTimeout(()=>startScroll(inner,itemLabel),10);
    } else {
      // 非選択：省略なしでそのまま表示
      const span=document.createElement("span");
      span.style.flex="1";
      span.style.overflow="hidden";
      span.style.textOverflow="ellipsis";
      span.style.whiteSpace="nowrap";
      span.textContent=itemLabel;
      div.appendChild(span);
      if(item.arrow && idx===selIdx){const a=document.createElement("span");a.className="arrow";a.textContent=">";div.appendChild(a);}
    }

    listEl.appendChild(div);
  }
}

render();


/* =====================
   スライドアニメ
===================== */
function makeGhost(){
  const listEl=document.getElementById("list");
  const wrapper=document.getElementById("list-wrapper");
  // 既存ghostがあれば削除
  const old=document.getElementById("list-ghost");
  if(old&&old.parentNode) old.parentNode.removeChild(old);

  const ghost=document.createElement("div");
  ghost.id="list-ghost";
  ghost.style.cssText=
    "position:absolute;top:0;left:0;width:100%;height:100%;"+
    "background:#e5e5e5;overflow:hidden;pointer-events:none;";
  ghost.innerHTML=listEl.innerHTML;
  if(wrapper) wrapper.insertBefore(ghost,listEl);
}

function slideList(direction){
  const listEl=document.getElementById("list");
  const wrapper=document.getElementById("list-wrapper");
  const isFull=wrapper&&wrapper.classList.contains("full");
  if(wrapper) wrapper.style.overflow=isFull?"visible":"hidden";

  const ghost=document.getElementById("list-ghost");

  if(direction==="right"){
    // 進む：ghostを下（z:0）、新リストが上（z:1）から右スライド
    if(ghost) ghost.style.zIndex="0";
    listEl.style.zIndex="1";
    listEl.classList.remove("slide-right","slide-left");
    void listEl.offsetWidth;
    listEl.classList.add("slide-right");
    listEl.addEventListener("animationend",()=>{
      listEl.classList.remove("slide-right");
      listEl.style.zIndex="";
      if(ghost&&ghost.parentNode) ghost.parentNode.removeChild(ghost);
      if(wrapper&&!wrapper.classList.contains("full")) wrapper.style.overflow="hidden";
    },{once:true});

  } else {
    // 戻る：ghostを上（z:1）でそのまま右にCSS transitionで退場
    if(ghost){
      ghost.style.zIndex="1";
      listEl.style.zIndex="0";
      ghost.style.transition="transform 0.18s ease-out";
      ghost.style.transform="translateX(0)";
      // 1フレーム後に右へ
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          ghost.style.transform="translateX(100%)";
          ghost.addEventListener("transitionend",()=>{
            if(ghost.parentNode) ghost.parentNode.removeChild(ghost);
            listEl.style.zIndex="";
            if(wrapper&&!wrapper.classList.contains("full")) wrapper.style.overflow="hidden";
          },{once:true});
        });
      });
    }
  }
}


/* =====================
   ローカル曲取得（サーバー不要・端末内ファイル）
===================== */
document.getElementById("local-file-input").addEventListener("change",(e)=>{
  const files=Array.from(e.target.files||[]);
  if(files.length===0)return;
  files.forEach(file=>{
    const url=URL.createObjectURL(file);
    const nameNoExt=file.name.replace(/\.[^/.]+$/,"");
    let artist="ローカル", title=nameNoExt;
    const parts=nameNoExt.split(" - ");
    if(parts.length>=2){artist=parts[0].trim();title=parts.slice(1).join(" - ").trim();}
    songs.push({source:"local",url,file,title,artist});
  });
  currentSongIdx=Math.max(0,songs.length-files.length);
  MENUS=buildMenus();
  render();
  // ファイル追加後は曲一覧を確認しやすいようsongsメニューへ
  makeGhost();
  menuStack.push({menuKey:"songs",selectedIdx:currentSongIdx,scrollOffset:0});
  render();
  slideList("right");
  // 同じファイルを連続で選び直せるよう毎回リセット
  e.target.value="";
});

/* =====================
   プレイリスト取得
===================== */

function closePlaylistOverlay(overlay,input,onKey){
  overlay.style.transition="transform 0.18s ease-out";
  overlay.style.transform="translateX(100%)";
  overlay.addEventListener("transitionend",()=>{
    overlay.style.display="none";
    overlay.style.transform="";
    overlay.style.transition="";
    if(input&&onKey) input.removeEventListener("keydown",onKey);
  },{once:true});
}

function openPlaylistOverlay(){
  const overlay=document.getElementById("playlist-overlay");
  const input=document.getElementById("playlist-input");
  const status=document.getElementById("playlist-status");
  const result=document.getElementById("playlist-result");
  status.textContent=t("playlistpaste");
  result.textContent="";
  input.value="";

  // スライドアニメで表示
  makeGhost();
  overlay.style.display="flex";
  overlay.style.transform="translateX(100%)";
  overlay.style.transition="transform 0.18s ease-out";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    overlay.style.transform="translateX(0)";
  }));
  setTimeout(()=>input.focus(),200);

  // Enterで取得、Escapeで閉じる
  function onKey(e){
    if(e.key==="Escape"){
      closePlaylistOverlay(overlay,input,onKey);
      return;
    }
    if(e.key==="Enter"){
      const url=input.value.trim();
      if(!url)return;
      status.textContent=t("playlistloading");
      result.textContent="";
      fetch("/api/playlist",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({url})
      })
      .then(r=>r.json())
      .then(data=>{
        if(data.error){
          result.textContent="⚠ "+data.error;
          status.textContent="";
          return;
        }
        // songsをまるごと置き換え
        songs.length=0;
        data.songs.forEach(s=>songs.push(s));
        currentSongIdx=0;
        // MENUSのsongsを再構築
        MENUS=buildMenus();
        result.textContent="✓ "+data.count+"曲を読み込みました";
        status.textContent="";
        setTimeout(()=>{
          closePlaylistOverlay(overlay,input,onKey);
        },1500);
      })
      .catch(err=>{
        result.textContent="⚠ 接続エラー: "+err.message;
        status.textContent="";
      });
    }
  }
  input.addEventListener("keydown",onKey);
}

function menuDown(){

  if(cur.selectedIdx<items.length-1){
    cur.selectedIdx++;
    if(cur.selectedIdx>=cur.scrollOffset+visibleCount)cur.scrollOffset++;
    render();clickSound();
  }
}

function menuSelect(){
  // プレイリスト入力画面が開いていればペースト＆送信
  const overlay=document.getElementById("playlist-overlay");
  if(overlay&&overlay.style.display!=="none"){
    const input=document.getElementById("playlist-input");
    navigator.clipboard.readText().then(text=>{
      input.value=text;
      input.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",bubbles:true}));
    }).catch(()=>{
      // クリップボードアクセス失敗時はEnterだけ送る
      input.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",bubbles:true}));
    });
    return;
  }
  if(screenMode==="nowplaying"){
    // Now Playing画面ではセンター = togglePlay
    togglePlay();return;
  }
  const cur=menuStack[menuStack.length-1];
  const item=MENUS[cur.menuKey][cur.selectedIdx];
  clickSound();

  if(item.action==="goto"){
    makeGhost();
    menuStack.push({menuKey:item.target,selectedIdx:0,scrollOffset:0});
    render();
    slideList("right");
  } else if(item.action==="playsong"){
    shuffleMode=false;
    playSong(item.idx);
    if(autoNowPlaying) showNowPlayingScreen("right");
  } else if(item.action==="shuffle"){
    shufflePlay();
    showNowPlayingScreen("right");
  } else if(item.action==="nowplaying"){
    showNowPlayingScreen("right");
  } else if(item.action==="toggleautonp"){
    autoNowPlaying=!autoNowPlaying;
    render();
    return;
  } else if(item.action==="togglelistmode"){
    listThumbMode=!listThumbMode;
    render();
    return;
  } else if(item.action==="toggleclock"){
    clockEnabled=!clockEnabled;
    if(!clockEnabled){stopClock();restoreTopText();}
    render();
    return;
  } else if(item.action==="toggleclock24"){
    clock24h=!clock24h;
    render();
    return;
  } else if(item.action==="toggleclick"){
    clickSoundEnabled=!clickSoundEnabled;
    render();
    return;
  } else if(item.action==="openplaylist"){
    openPlaylistOverlay();
    return;
  } else if(item.action==="openlocalpicker"){
    document.getElementById("local-file-input").click();
    return;
  } else if(item.action==="setlang"){
    lang=lang==="en"?"ja":"en";
    rebuildMenus();
    render();
  }
}

function menuBack(){
  clickSound();
  // プレイリスト入力画面が開いていれば閉じる
  const overlay=document.getElementById("playlist-overlay");
  if(overlay && overlay.style.display!=="none"){
    closePlaylistOverlay(overlay,null,null);
    return;
  }
  if(screenMode==="nowplaying"){
    showMenuScreen("left");return;
  }
  if(menuStack.length>1){
    makeGhost();
    menuStack.pop();
    render();
    slideList("left");
  }
}

/* =====================
   ホイール入力
===================== */
const wheel=document.getElementById("wheel");
let touchLastAngle=null,touchAccum=0,isScrolling=false;

function getAngle(x,y){
  const r=wheel.getBoundingClientRect();
  return Math.atan2(y-(r.top+r.height/2),x-(r.left+r.width/2));
}

wheel.addEventListener("touchstart",(e)=>{
  resetIdleTimer();
  const t=e.touches[0];
  touchLastAngle=getAngle(t.clientX,t.clientY);
  touchAccum=0;isScrolling=false;
});

wheel.addEventListener("touchmove",(e)=>{
  const t=e.touches[0];
  const angle=getAngle(t.clientX,t.clientY);
  let diff=angle-touchLastAngle;
  if(diff>Math.PI)diff-=Math.PI*2;
  if(diff<-Math.PI)diff+=Math.PI*2;
  touchAccum+=diff;
  if(Math.abs(touchAccum)>0.05)isScrolling=true;
  if(touchAccum>0.25){
    if(screenMode==="nowplaying") volumeUp();
    else menuDown();
    touchAccum=0;
  }
  if(touchAccum<-0.25){
    if(screenMode==="nowplaying") volumeDown();
    else menuUp();
    touchAccum=0;
  }
  touchLastAngle=angle;
  e.preventDefault();
},{passive:false});

wheel.addEventListener("touchend",(e)=>{
  e.preventDefault();
  const r=wheel.getBoundingClientRect();
  const t=e.changedTouches[0];
  const x=t.clientX-r.left, y=t.clientY-r.top;
  const cx=r.width/2, cy=r.height/2;
  const dist=Math.sqrt((x-cx)**2+(y-cy)**2);

  if(dist<=45){menuSelect();return;}
  if(isScrolling)return;
  // 外周ボタンはidで直接処理するのでここでは何もしない
},{passive:false});

let mouseStartX=0,mouseStartY=0,mouseLastAngle=null,mouseAccum=0,mouseDragged=false;

wheel.addEventListener("mousedown",(e)=>{
  resetIdleTimer();
  mouseStartX=e.clientX;mouseStartY=e.clientY;
  mouseLastAngle=getAngle(e.clientX,e.clientY);
  mouseAccum=0;mouseDragged=false;
});

wheel.addEventListener("mousemove",(e)=>{
  if(e.buttons!==1)return;
  const dx=Math.abs(e.clientX-mouseStartX), dy=Math.abs(e.clientY-mouseStartY);
  if(dx>10||dy>10)mouseDragged=true;
  const angle=getAngle(e.clientX,e.clientY);
  if(mouseLastAngle!==null){
    let diff=angle-mouseLastAngle;
    if(diff>Math.PI)diff-=Math.PI*2;
    if(diff<-Math.PI)diff+=Math.PI*2;
    mouseAccum+=diff;
    if(mouseAccum>0.12){
      if(screenMode==="nowplaying") volumeUp();
      else menuDown();
      mouseAccum=0;
    }
    if(mouseAccum<-0.12){
      if(screenMode==="nowplaying") volumeDown();
      else menuUp();
      mouseAccum=0;
    }
  }
  mouseLastAngle=angle;
});

wheel.addEventListener("mouseup",(e)=>{
  const r=wheel.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const cx=r.width/2, cy=r.height/2;
  const dist=Math.sqrt((x-cx)**2+(y-cy)**2);

  if(dist<=45){menuSelect();mouseDragged=false;return;}
  if(mouseDragged){mouseDragged=false;return;}

  // 外周ボタンはidで直接処理するのでここでは何もしない

  mouseDragged=false;
});

/* =====================
   レスポンシブスケール
===================== */
function scaleIpod(){
  const ipod=document.getElementById("ipod");
  const W=window.innerWidth;
  const H=window.innerHeight;
  const ipodW=260;
  const ipodH=420;
  const margin=16; // 余白px
  const scaleX=(W-margin*2)/ipodW;
  const scaleY=(H-margin*2)/ipodH;
  const scale=Math.min(scaleX,scaleY,2); // 最大2倍まで
  ipod.style.transform=`scale(${scale})`;
}
window.addEventListener("resize",scaleIpod);

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("boot").style.display="none";
    resetIdleTimer();
    scaleIpod();
  },2000);
  scaleIpod();
});
</script>
